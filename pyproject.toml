[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "canpii"
version = "0.1.0"
description = "Canadian PII recognizers (health numbers, passport, BN, bank, driver's licences) for Microsoft Presidio, with English/French context, LiteLLM/MCP-gateway exports and PIPEDA/PHIPA/Law 25 presets."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Arthur Jin", email = "arthurjin1998@gmail.com" }]
maintainers = [{ name = "Arthur Jin", email = "arthurjin1998@gmail.com" }]
keywords = [
    "presidio",
    "pii",
    "privacy",
    "canada",
    "pipeda",
    "phipa",
    "law 25",
    "loi 25",
    "ohip",
    "ramq",
    "de-identification",
    "redaction",
    "anonymization",
    "litellm",
    "mcp",
    "guardrails",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "presidio-analyzer>=2.2.365",  # first release with upstream CaSinRecognizer / CaPostalCodeRecognizer
    "pyyaml>=6.0",
]

[project.optional-dependencies]
anonymizer = ["presidio-anonymizer>=2.2.365"]

[project.urls]
Homepage = "https://github.com/ArthurJZL/canpii"
Documentation = "https://github.com/ArthurJZL/canpii#readme"
Repository = "https://github.com/ArthurJZL/canpii"
Issues = "https://github.com/ArthurJZL/canpii/issues"
Changelog = "https://github.com/ArthurJZL/canpii/blob/main/CHANGELOG.md"

[project.scripts]
canpii = "canpii.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "presidio-anonymizer>=2.2.365",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "benchmarks/",
    "docs/",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "NOTICE",
]
# "README.md" above matches at any depth; keep the demo and examples out.
exclude = ["/demo", "/examples"]

[tool.hatch.build.targets.wheel]
packages = ["src/canpii"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "D"]
ignore = [
    "D105", # magic methods
    "D107", # __init__ documented on the class, as in Presidio
    "D203",
    "D213",
    "D400", # validator docstrings end with a provenance tag, e.g. "[official]"
    "D415",
    "RUF012", # PATTERNS / CONTEXT are mutable class attributes, following Presidio's convention
    "RUF001", # French text legitimately contains ambiguous-looking characters
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"benchmarks/**" = ["D"]
"src/canpii/synthetic.py" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nlp: needs spaCy models en_core_web_sm / fr_core_news_sm (skipped if missing)",
]
addopts = "-ra"
