name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EN_MODEL: https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
  FR_MODEL: https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.13
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Install spaCy small models
        run: uv pip install "en_core_web_sm @ $EN_MODEL" "fr_core_news_sm @ $FR_MODEL"
      - run: uv run pytest
      - name: Benchmark smoke run
        if: matrix.python-version == '3.13'
        run: uv run python benchmarks/run_benchmark.py --n 2

  test-without-models:
    # Pattern-level tests must pass even when spaCy models cannot be downloaded.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Install wheel in a clean environment and import it
        run: |
          uv venv /tmp/wheel-env --python 3.13
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/canpii --version
          /tmp/wheel-env/bin/canpii export --format contextforge > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        run: |
          missing=0
          for sha in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha is missing a Signed-off-by line (use git commit -s)"
              missing=1
            fi
          done
          exit $missing
